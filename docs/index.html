<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avance de proyectos · Sociedad de Padres de Familia</title>
<style>
  :root{--navy:#12284c;--navy2:#244a86;--bg:#f3f5f9;--card:#fff;--ink:#14213a;--muted:#55627a;--line:#cbd3e1;--gold:#f2a33a;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--navy);color:#fff;padding:32px 16px 40px;border-bottom:6px solid var(--gold)}
  .in{max-width:980px;margin:0 auto}
  .eyebrow{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin:0 0 6px}
  h1{margin:0;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.15}
  .school{margin:8px 0 0;opacity:.9}
  main{max-width:980px;margin:-22px auto 0;padding:0 16px 56px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  .tile{background:var(--card);border-radius:8px;padding:14px 16px;border-top:4px solid var(--navy);box-shadow:0 1px 3px rgba(18,40,76,.12)}
  .tile b{display:block;font-size:2rem;line-height:1.1;color:var(--navy)}
  .tile span{color:var(--muted);font-size:.9rem}
  .proj{background:var(--card);border-radius:8px;padding:20px 20px 18px;margin-bottom:16px;border-left:6px solid var(--navy);box-shadow:0 1px 3px rgba(18,40,76,.12)}
  .head{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}
  h2{margin:0;font-size:1.3rem;color:var(--navy)}
  .tag{font-size:.8rem;font-weight:600;color:var(--navy);background:#e3eaf6;padding:3px 10px;border-radius:99px}
  .desc{margin:4px 0 20px;color:var(--muted)}
  .steps{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
  .step{position:relative;text-align:center;padding:0 4px}
  .step::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:4px;background:var(--line)}
  .step:first-child::before{display:none}
  .step.done::before,.step.now::before{background:var(--navy)}
  .dot{position:relative;z-index:1;width:34px;height:34px;margin:0 auto 8px;border-radius:50%;border:3px solid var(--line);background:#fff;
    display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--muted)}
  .done .dot{background:var(--navy);border-color:var(--navy);color:#fff}
  .now .dot{background:var(--gold);border-color:var(--gold);color:var(--navy);box-shadow:0 0 0 5px rgba(242,163,58,.3)}
  .lbl{font-size:.85rem;line-height:1.3;color:var(--muted)}
  .done .lbl{color:var(--ink)}
  .now .lbl{color:var(--navy);font-weight:700}
  .here{display:inline-block;margin-top:6px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    background:var(--navy);color:#fff;padding:2px 8px;border-radius:4px}
  .foot{margin-top:18px;padding:10px 14px;background:#eef2f9;border-radius:6px;font-size:.93rem}
  .foot b{color:var(--navy)}
  .meta{margin-top:8px;font-size:.85rem;color:var(--muted)}
  .acts{margin-top:16px}
  .acts>summary{cursor:pointer;font-weight:700;color:var(--navy);list-style:none;padding:4px 0}
  .acts>summary::-webkit-details-marker{display:none}
  .acts>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
  .acts[open]>summary::before{transform:rotate(90deg)}
  .acts ul{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}
  .acts li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:.95rem;line-height:1.35}
  .ck{width:20px;height:20px;border-radius:5px;border:2px solid var(--line);display:grid;place-items:center;font-size:.72rem;font-weight:700;margin-top:1px;background:#fff}
  .acts li.done .ck{background:var(--navy);border-color:var(--navy);color:#fff}
  .acts li.doing .ck{border-color:var(--gold);background:#fdf0d8;color:var(--navy)}
  .acts li.done .t{color:var(--muted)}
  .pill{margin-left:6px;font-size:.72rem;font-weight:700;color:#7a4a00;background:#fdf0d8;padding:1px 7px;border-radius:99px;white-space:nowrap}
  footer{max-width:980px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.9rem}
  @media (max-width:720px){
    .tiles{grid-template-columns:repeat(2,1fr)}
    .acts ul{grid-template-columns:1fr}
    .steps{grid-auto-flow:row}
    .step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:7px 0}
    .step::before{left:15px;top:-50%;width:4px;height:100%}
    .dot{margin:0}
    .here{margin:0 0 0 8px}
  }
</style>
</head>
<body>
<header><div class="in">
  <p class="eyebrow" id="eyebrow"></p>
  <h1>Avance de proyectos</h1>
  <p class="school" id="school"></p>
</div></header>
<main>
  <section class="tiles" id="tiles" aria-label="Resumen"></section>
  <section id="list"></section>
</main>
<footer id="updated"></footer>

<script>
/* ==========================================================================
   EDITA SOLO ESTA SECCIÓN.
   - stages:  las etapas del proyecto, en orden.
   - current: número de la etapa en la que van (1 = la primera). Las anteriores
              se marcan como hechas. Si el proyecto terminó, pon un número
              mayor a la cantidad de etapas.
   - next:    el siguiente paso concreto (opcional).
   - actions: lista de actividades. Cada una lleva su estado: "done" (hecha),
              "doing" (en curso) o "todo" (pendiente).
   ========================================================================== */
const DATA = {
  eyebrow: "Sociedad de Padres de Familia 2026-2027",
  school:  "Escuela Primaria Venustiano Carranza",
  updated: "20 de octubre de 2026",
  projects: [
    {
      name: "Escuela segura", tag: "Prioridad 1 · Seguridad",
      desc: "Identificar, documentar y atender los riesgos prioritarios: árbol hueco, arriates, pasamanos del escenario, rampas y señalética.",
      stages: ["Identificar riesgos", "Documentar y priorizar", "Planeación", "Cotización", "Recursos", "Ejecución", "Verificación"],
      current: 2,
      next: "Documentar cada riesgo con fotos y definir el orden de atención.",
      actions: [["Documentar con fotos los riesgos prioritarios","doing"],["Árbol hueco y arriates por caerse","todo"],["Pasamanos del escenario y rampas","todo"],["Señalética y paso peatonal","todo"],["Pisos con desniveles y resbalosos","todo"],["Contactos eléctricos sin protección","todo"],["Rescate del campo de fútbol","todo"],["Pintura de la cancha y mantenimiento de la plaza principal","todo"]]
    },
    {
      name: "Recuperación de áreas verdes", tag: "Prioridad 1 · Seguridad y limpieza",
      desc: "Limpieza y poda de las áreas verdes dentro y fuera de la escuela, y retiro de residuos.",
      stages: ["Identificar zonas", "Planeación y fechas", "Cotización o voluntarios", "Limpieza y poda", "Retiro de residuos", "Mantenimiento"],
      current: 2,
      next: "Definir fecha de la jornada y cuántos voluntarios o qué proveedor se necesita.",
      actions: [["Identificar zonas con hierba y plantas peligrosas","done"],["Compra y entrega de material y herramientas de limpieza al personal de apoyo","done"],["Definir fecha de la jornada de limpieza","todo"],["Conseguir voluntarios o cotizar un proveedor","todo"],["Limpieza y poda dentro de la escuela","todo"],["Limpieza y poda fuera de la escuela","todo"],["Retiro de residuos","todo"],["Plan de mantenimiento periódico","todo"]]
    },
    {
      name: "Área de comedor escolar", tag: "Prioridad 2 · Salud y bienestar",
      desc: "Recuperar un espacio y crear un lugar digno, seguro y protegido para que los niños coman.",
      stages: ["Necesidad detectada", "Planeación y diseño", "Cotización", "Presupuesto y recursos", "Autorización de la escuela", "Construcción", "Entrega y uso"],
      current: 2,
      next: "Definir el espacio, qué se necesita (mesas, sombra, techo) y pedir cotizaciones.",
      actions: [["Confirmar la necesidad (los niños comen en el piso)","done"],["Elegir el espacio","todo"],["Planeación y diseño del área","todo"],["Cotizar mesas, techo o sombra","todo"],["Definir presupuesto y de dónde saldrán los recursos","todo"],["Pedir autorización a la dirección de la escuela","todo"],["Construcción o instalación","todo"],["Reglas de uso y limpieza","todo"]]
    },
    {
      name: "Aulas en buenas condiciones", tag: "Prioridad 3 · Funcionamiento de salones",
      desc: "Atender pintarrones, iluminación, ventiladores, enchufes y equipos de los salones.",
      stages: ["Levantamiento por salón", "Priorización", "Cotización", "Recursos", "Atención de necesidades", "Verificación"],
      current: 2,
      next: "Ordenar las necesidades de los 16 maestros que respondieron y elegir cuáles van primero.",
      actions: [["Levantamiento con el formulario a maestros (16 respuestas)","done"],["Filtraciones en techos de salones","done"],["Ordenar y priorizar las necesidades","doing"],["Cable del proyector y enchufes","todo"],["Ventiladores y lámparas","todo"],["Pintarrones","todo"],["Computadoras e impresora","todo"]]
    },
    {
      name: "Actividades de sana convivencia", tag: "Convivencia y recaudación",
      desc: "Kermés, rifas, ventas y festivales; donaciones en especie y alianzas para financiar los proyectos.",
      stages: ["Planeación", "Calendario", "Kermés", "Rifas, ventas y festivales", "Donaciones y alianzas", "Rendición de cuentas"],
      current: 1,
      next: "Sistema de cobro de la kermés listo. Falta definir fecha y menú.",
      actions: [["Sistema de cobro de la kermés","done"],["Definir fecha y menú de la kermés","doing"],["Realizar la kermés","todo"],["Rifas","todo"],["Ventas","todo"],["Festivales","todo"],["Donaciones en especie (premios, alimentos, materiales, servicios)","todo"],["Gestión y alianzas con apoyos externos","todo"],["Rendición de cuentas a los padres","todo"]]
    },
    {
      name: "Proyectos de mayor inversión", tag: "Prioridad 4 · Gestión y recursos",
      desc: "Proyectos grandes que requieren más recursos o autorización, y que se buscarán con apoyos externos.",
      stages: ["Definir alcance", "Cotización", "Gestión de apoyos", "Autorización", "Ejecución", "Entrega"],
      current: 1,
      next: "Definir cuál de estos proyectos se atiende primero.",
      actions: [["Remodelación de baños","todo"],["Techar la cancha","todo"],["Biblioteca","todo"],["Wifi y cámaras","todo"],["Rescate del bebedero","todo"]]
    }
  ]
};

/* ---------------- Desde aquí no hace falta editar ---------------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P = DATA.projects.map(p => {
  const n = p.stages.length, c = Math.max(1, p.current);
  return { ...p, n, c, status: c > n ? "done" : (c === 1 ? "start" : "doing") };
});
const count = k => P.filter(p => p.status === k).length;

document.getElementById("eyebrow").textContent = DATA.eyebrow;
document.getElementById("school").textContent = DATA.school;
document.getElementById("updated").textContent = "Última actualización: " + DATA.updated;
document.title = "Avance de proyectos · " + DATA.eyebrow;

document.getElementById("tiles").innerHTML = [
  [P.length, "Proyectos"], [count("doing"), "En avance"],
  [P.reduce((a, p) => a + (p.actions || []).filter(x => x[1] === "done").length, 0) + " de " + P.reduce((a, p) => a + (p.actions || []).length, 0), "Acciones hechas"],
  [count("done"), "Proyectos completados"]
].map(([v, t]) => `<div class="tile"><b>${v}</b><span>${t}</span></div>`).join("");

document.getElementById("list").innerHTML = P.map(p => `
  <article class="proj">
    <div class="head"><h2>${esc(p.name)}</h2><span class="tag">${esc(p.tag)}</span></div>
    <p class="desc">${esc(p.desc)}</p>
    <ol class="steps">${p.stages.map((s, i) => {
      const k = i + 1 < p.c ? "done" : (i + 1 === p.c && p.c <= p.n ? "now" : (p.c > p.n ? "done" : "todo"));
      return `<li class="step ${k}"><span class="dot" aria-hidden="true">${k === "done" ? "✓" : i + 1}</span>
        <span class="lbl">${esc(s)}${k === "now" ? `<br><span class="here">Estamos aquí</span>` : ""}</span></li>`;
    }).join("")}</ol>
    ${p.actions && p.actions.length ? `<details class="acts" open>
      <summary>Actividades y acciones · ${p.actions.filter(a => a[1] === "done").length} de ${p.actions.length} hechas</summary>
      <ul>${p.actions.map(a => `<li class="${a[1]}"><span class="ck" aria-hidden="true">${a[1] === "done" ? "✓" : (a[1] === "doing" ? "…" : "")}</span>
        <span class="t">${esc(a[0])}${a[1] === "doing" ? `<span class="pill">En curso</span>` : ""}</span></li>`).join("")}</ul>
    </details>` : ""}
    ${p.next && p.status !== "done" ? `<div class="foot"><b>Siguiente paso:</b> ${esc(p.next)}</div>` : ""}
    <div class="meta">${p.status === "done" ? "Proyecto completado" : `Etapa ${p.c} de ${p.n}`}</div>
  </article>`).join("");
</script>
</body>
</html>
